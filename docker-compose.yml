services:
  protonmail-bridge:
    image: dancwilliams/protonmail-bridge:latest
    ports:
      - 1025:25/tcp
      - 1143:143/tcp
    restart: unless-stopped
    volumes:
      - protonmail:/root
    # Optional: set a passphrase to encrypt the GPG keyring (see README)
    # environment:
    #   - KEYRING_PASSPHRASE=your-passphrase-here
  ollama:
    image: ollama/ollama
    cpus: 3.0
    ports:
      - 11434:11434
    restart: unless-stopped
    environment:
      LLAMA_ARG_CACHE_RAM: "1024"
    volumes:
      - ollama:/root/.ollama

volumes:
  protonmail:
    name: protonmail
  ollama:
    name: ollama
