services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
  protonmail-bridge:
    image: dancwilliams/protonmail-bridge:latest
    ports:
      - 1025:25/tcp
      - 1143:143/tcp
    restart: unless-stopped
    volumes:
      - protonmail:/root
    # Optional: set a passphrase to encrypt the GPG keyring (see README)
    # environment:
    #   - KEYRING_PASSPHRASE=your-passphrase-here
  ollama:
    image: ollama/ollama
    cpus: 3.0
    ports:
      - 11434:11434
    restart: unless-stopped
    environment:
      LLAMA_ARG_CACHE_RAM: "1024"
    volumes:
      - ollama:/root/.ollama

volumes:
  postgres_data:
  protonmail:
    name: protonmail
  ollama:
    name: ollama
